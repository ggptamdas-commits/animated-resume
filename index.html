<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack -- 3D Creator</title>
    <meta name="description" content="Portfolio of Jack -- a 3D creator driven by crafting striking and unforgettable projects." />

    <!-- Google Fonts: Kanit (Weights 300-900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN for instant browser preview & standalone GitHub Pages hosting -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              darkBg: '#0C0C0C',
              textLight: '#D7E2EA',
            },
            fontFamily: {
              kanit: ['Kanit', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- Global Styles -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body, #root {
        background-color: #0C0C0C;
        color: #D7E2EA;
        font-family: 'Kanit', sans-serif;
        overflow-x: clip;
        min-height: 100vh;
        width: 100%;
      }

      .hero-heading {
        background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Custom smooth scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0C0C0C;
      }
      ::-webkit-scrollbar-thumb {
        background: #24292e;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3e444b;
      }
    </style>
  </head>
  <body class="bg-[#0C0C0C] text-[#D7E2EA] font-['Kanit'] selection:bg-[#7621B0] selection:text-white">
    <div id="root" class="bg-[#0C0C0C] min-h-screen w-full" style="overflow-x: clip;"></div>

    <!-- Vite module entry point for development & npm run build -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback browser bundle for direct GitHub Pages static serving -->
    <script type="module">
      // Check if root already has children (mounted by Vite), if not, initialize in browser
      setTimeout(async () => {
        const rootElem = document.getElementById('root');
        if (!rootElem || rootElem.children.length > 0) return;

        try {
          const React = (await import('https://esm.sh/react@18.3.1')).default;
          const { useState, useEffect, useRef } = React;
          const ReactDOM = (await import('https://esm.sh/react-dom@18.3.1/client')).default;
          const { motion, useScroll, useTransform, AnimatePresence } = await import('https://esm.sh/framer-motion@12.38.0');

          // 1. ContactButton
          const ContactButton = ({ className = '', onClick }) => {
            const handleClick = () => {
              if (onClick) {
                onClick();
                return;
              }
              const contactEl = document.getElementById('contact');
              if (contactEl) {
                contactEl.scrollIntoView({ behavior: 'smooth' });
              } else {
                window.location.href = 'mailto:jack3dcreator@gmail.com';
              }
            };

            return React.createElement(
              motion.button,
              {
                type: 'button',
                onClick: handleClick,
                whileHover: { scale: 1.05 },
                whileTap: { scale: 0.95 },
                className: `rounded-full uppercase font-medium tracking-widest text-white cursor-pointer px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base select-none transition-transform duration-300 ${className}`,
                style: {
                  background: 'linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)',
                  boxShadow: '0px 4px 4px rgba(181, 1, 167, 0.25), inset 4px 4px 12px #7721B1',
                  outline: '2px solid white',
                  outlineOffset: '-3px',
                },
              },
              'Contact Me'
            );
          };

          // 2. LiveProjectButton
          const LiveProjectButton = ({ href = '#', onClick, className = '' }) => {
            return React.createElement(
              motion.a,
              {
                href,
                target: '_blank',
                rel: 'noopener noreferrer',
                onClick,
                whileHover: { scale: 1.04 },
                whileTap: { scale: 0.96 },
                className: `inline-block rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base hover:bg-[#D7E2EA]/10 transition-colors duration-200 select-none text-center cursor-pointer ${className}`,
              },
              'Live Project'
            );
          };

          // 3. FadeIn
          const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = '', as = 'div' }) => {
            const Comp = motion[as] || motion.div;
            return React.createElement(
              Comp,
              {
                initial: { opacity: 0, x, y },
                whileInView: { opacity: 1, x: 0, y: 0 },
                viewport: { once: true, margin: '50px', amount: 0 },
                transition: { duration, delay, ease: [0.25, 0.1, 0.25, 1] },
                className,
              },
              children
            );
          };

          // 4. Magnet
          const Magnet = ({
            children,
            padding = 150,
            strength = 3,
            activeTransition = 'transform 0.3s ease-out',
            inactiveTransition = 'transform 0.6s ease-in-out',
            className = '',
          }) => {
            const containerRef = useRef(null);
            const [transform, setTransform] = useState('translate3d(0px, 0px, 0px)');
            const [transition, setTransition] = useState(inactiveTransition);

            useEffect(() => {
              const handleMouseMove = (e) => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distX = e.clientX - centerX;
                const distY = e.clientY - centerY;
                const halfWidth = rect.width / 2;
                const halfHeight = rect.height / 2;

                const isInside =
                  Math.abs(distX) <= halfWidth + padding &&
                  Math.abs(distY) <= halfHeight + padding;

                if (isInside) {
                  setTransition(activeTransition);
                  setTransform(`translate3d(${distX / strength}px, ${distY / strength}px, 0px)`);
                } else {
                  setTransition(inactiveTransition);
                  setTransform('translate3d(0px, 0px, 0px)');
                }
              };

              window.addEventListener('mousemove', handleMouseMove, { passive: true });
              return () => window.removeEventListener('mousemove', handleMouseMove);
            }, [padding, strength, activeTransition, inactiveTransition]);

            return React.createElement(
              'div',
              {
                ref: containerRef,
                className,
                style: { transform, transition, willChange: 'transform' },
              },
              children
            );
          };

          // 5. AnimatedText
          const AnimatedText = ({ text, className = '' }) => {
            const containerRef = useRef(null);
            const { scrollYProgress } = useScroll({
              target: containerRef,
              offset: ['start 0.8', 'end 0.2'],
            });

            const words = text.split(' ');
            const totalChars = text.length;
            let charIndexCounter = 0;

            const CharSpan = ({ char, progress, range }) => {
              const opacity = useTransform(progress, range, [0.2, 1]);
              return React.createElement(
                'span',
                { className: 'relative inline-block' },
                React.createElement('span', { className: 'opacity-0 select-none' }, char),
                React.createElement(
                  motion.span,
                  { style: { opacity }, className: 'absolute inset-0 select-none pointer-events-none' },
                  char
                )
              );
            };

            return React.createElement(
              'p',
              { ref: containerRef, className },
              words.map((word, wordIndex) => {
                const wordChars = Array.from(word);
                return React.createElement(
                  'span',
                  { key: wordIndex, className: 'inline-block whitespace-nowrap' },
                  wordChars.map((char) => {
                    const charIdx = charIndexCounter++;
                    const start = charIdx / totalChars;
                    const end = Math.min(1, (charIdx + 1) / totalChars);
                    return React.createElement(CharSpan, {
                      key: charIdx,
                      char,
                      progress: scrollYProgress,
                      range: [start, end],
                    });
                  }),
                  wordIndex < words.length - 1
                    ? React.createElement(
                        'span',
                        { className: 'inline-block' },
                        (() => {
                          const spaceIdx = charIndexCounter++;
                          const start = spaceIdx / totalChars;
                          const end = Math.min(1, (spaceIdx + 1) / totalChars);
                          return React.createElement(CharSpan, {
                            key: spaceIdx,
                            char: ' ',
                            progress: scrollYProgress,
                            range: [start, end],
                          });
                        })()
                      )
                    : null
                );
              })
            );
          };

          // 6. HeroSection
          const HeroSection = () => {
            return React.createElement(
              'header',
              { className: 'h-screen w-full flex flex-col justify-between relative select-none', style: { overflowX: 'clip' } },
              // Navbar
              React.createElement(
                FadeIn,
                { delay: 0, y: -20, className: 'w-full z-30' },
                React.createElement(
                  'nav',
                  { className: 'flex justify-between items-center w-full px-6 md:px-10 pt-6 md:pt-8 text-[#D7E2EA] font-medium uppercase tracking-wider text-sm md:text-lg lg:text-[1.4rem]' },
                  React.createElement('a', { href: '#about', className: 'hover:opacity-70 transition-opacity duration-200 cursor-pointer' }, 'About'),
                  React.createElement('a', { href: '#services', className: 'hover:opacity-70 transition-opacity duration-200 cursor-pointer' }, 'Price'),
                  React.createElement('a', { href: '#projects', className: 'hover:opacity-70 transition-opacity duration-200 cursor-pointer' }, 'Projects'),
                  React.createElement('a', { href: '#contact', className: 'hover:opacity-70 transition-opacity duration-200 cursor-pointer' }, 'Contact')
                )
              ),
              // Hero Heading
              React.createElement(
                'div',
                { className: 'w-full overflow-hidden flex items-center justify-center my-auto z-0 pointer-events-none' },
                React.createElement(
                  FadeIn,
                  { delay: 0.15, y: 40, className: 'w-full' },
                  React.createElement(
                    'h1',
                    { className: 'hero-heading font-black uppercase tracking-tight leading-none whitespace-nowrap w-full text-center text-[14vw] sm:text-[15vw] md:text-[16vw] lg:text-[17.5vw] mt-6 sm:mt-4 md:-mt-5' },
                    "Hi, i'm jack"
                  )
                )
              ),
              // Hero Portrait with Magnet
              React.createElement(
                'div',
                { className: 'absolute left-1/2 -translate-x-1/2 z-10 w-[280px] sm:w-[360px] md:w-[440px] lg:w-[520px] top-1/2 -translate-y-1/2 sm:top-auto sm:translate-y-0 sm:bottom-0 pointer-events-auto' },
                React.createElement(
                  FadeIn,
                  { delay: 0.6, y: 30, className: 'w-full flex justify-center' },
                  React.createElement(
                    Magnet,
                    {
                      padding: 150,
                      strength: 3,
                      activeTransition: 'transform 0.3s ease-out',
                      inactiveTransition: 'transform 0.6s ease-in-out',
                      className: 'w-full flex justify-center items-end',
                    },
                    React.createElement('img', {
                      src: 'https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png',
                      alt: 'Jack - 3D Creator Portrait',
                      className: 'w-full h-auto object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.8)] pointer-events-auto select-none',
                      draggable: false,
                    })
                  )
                )
              ),
              // Bottom bar
              React.createElement(
                'div',
                { className: 'flex justify-between items-end w-full px-6 md:px-10 pb-7 sm:pb-8 md:pb-10 z-20' },
                React.createElement(
                  FadeIn,
                  { delay: 0.35, y: 20 },
                  React.createElement(
                    'p',
                    {
                      className: 'text-[#D7E2EA] font-light uppercase tracking-wide leading-snug max-w-[160px] sm:max-w-[220px] md:max-w-[260px]',
                      style: { fontSize: 'clamp(0.75rem, 1.4vw, 1.5rem)' },
                    },
                    'a 3d creator driven by crafting striking and unforgettable projects'
                  )
                ),
                React.createElement(
                  FadeIn,
                  { delay: 0.5, y: 20 },
                  React.createElement(ContactButton, null)
                )
              )
            );
          };

          // 7. MarqueeSection
          const ROW1_IMAGES = [
            'https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif',
            'https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif',
            'https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif',
            'https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif',
            'https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif',
            'https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif',
            'https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif',
            'https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif',
            'https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif',
            'https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif',
            'https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif',
          ];

          const ROW2_IMAGES = [
            'https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif',
            'https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif',
            'https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif',
            'https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif',
            'https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif',
            'https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif',
            'https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif',
            'https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif',
            'https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif',
            'https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif',
          ];

          const ROW1_TRIPLED = [...ROW1_IMAGES, ...ROW1_IMAGES, ...ROW1_IMAGES];
          const ROW2_TRIPLED = [...ROW2_IMAGES, ...ROW2_IMAGES, ...ROW2_IMAGES];

          const MarqueeSection = () => {
            const sectionRef = useRef(null);
            const [offset, setOffset] = useState(0);

            useEffect(() => {
              let ticking = false;
              const handleScroll = () => {
                if (!ticking) {
                  window.requestAnimationFrame(() => {
                    if (sectionRef.current) {
                      const rect = sectionRef.current.getBoundingClientRect();
                      const sectionTop = window.scrollY + rect.top;
                      const calculatedOffset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
                      setOffset(calculatedOffset);
                    }
                    ticking = false;
                  });
                  ticking = true;
                }
              };

              window.addEventListener('scroll', handleScroll, { passive: true });
              handleScroll();
              return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return React.createElement(
              'section',
              {
                ref: sectionRef,
                className: 'bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 w-full overflow-hidden flex flex-col gap-3 select-none',
              },
              React.createElement(
                'div',
                {
                  className: 'flex gap-3 w-max',
                  style: { transform: `translateX(${offset - 200}px)`, willChange: 'transform' },
                },
                ROW1_TRIPLED.map((src, i) =>
                  React.createElement(
                    'div',
                    {
                      key: `r1-${i}`,
                      className: 'w-[420px] h-[270px] min-w-[420px] max-w-[420px] rounded-2xl overflow-hidden bg-[#161616] flex-shrink-0 shadow-lg',
                    },
                    React.createElement('img', {
                      src,
                      alt: '3D Motion',
                      loading: 'lazy',
                      className: 'w-full h-full object-cover rounded-2xl pointer-events-none',
                    })
                  )
                )
              ),
              React.createElement(
                'div',
                {
                  className: 'flex gap-3 w-max',
                  style: { transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' },
                },
                ROW2_TRIPLED.map((src, i) =>
                  React.createElement(
                    'div',
                    {
                      key: `r2-${i}`,
                      className: 'w-[420px] h-[270px] min-w-[420px] max-w-[420px] rounded-2xl overflow-hidden bg-[#161616] flex-shrink-0 shadow-lg',
                    },
                    React.createElement('img', {
                      src,
                      alt: '3D Motion',
                      loading: 'lazy',
                      className: 'w-full h-full object-cover rounded-2xl pointer-events-none',
                    })
                  )
                )
              )
            );
          };

          // 8. AboutSection
          const AboutSection = () => {
            return React.createElement(
              'section',
              {
                id: 'about',
                className: 'min-h-screen relative flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-20 bg-[#0C0C0C] select-none',
                style: { overflowX: 'clip' },
              },
              // 4 Corner 3D Decors
              React.createElement(
                FadeIn,
                { delay: 0.1, x: -80, y: 0, duration: 0.9, className: 'absolute top-[4%] left-[1%] sm:left-[2%] md:left-[4%] z-10 pointer-events-none' },
                React.createElement('img', {
                  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png',
                  alt: 'Moon Decor',
                  className: 'w-[120px] sm:w-[160px] md:w-[210px] h-auto object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.7)]',
                })
              ),
              React.createElement(
                FadeIn,
                { delay: 0.25, x: -80, y: 0, duration: 0.9, className: 'absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] z-10 pointer-events-none' },
                React.createElement('img', {
                  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png',
                  alt: '3D Geometry',
                  className: 'w-[100px] sm:w-[140px] md:w-[180px] h-auto object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.7)]',
                })
              ),
              React.createElement(
                FadeIn,
                { delay: 0.15, x: 80, y: 0, duration: 0.9, className: 'absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%] z-10 pointer-events-none' },
                React.createElement('img', {
                  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png',
                  alt: 'Lego Decor',
                  className: 'w-[120px] sm:w-[160px] md:w-[210px] h-auto object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.7)]',
                })
              ),
              React.createElement(
                FadeIn,
                { delay: 0.3, x: 80, y: 0, duration: 0.9, className: 'absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] z-10 pointer-events-none' },
                React.createElement('img', {
                  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png',
                  alt: 'Group Decor',
                  className: 'w-[130px] sm:w-[170px] md:w-[220px] h-auto object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.7)]',
                })
              ),
              // Content Container
              React.createElement(
                'div',
                { className: 'max-w-4xl w-full flex flex-col items-center text-center z-20' },
                React.createElement(
                  FadeIn,
                  { delay: 0, y: 40 },
                  React.createElement(
                    'h2',
                    {
                      className: 'hero-heading font-black uppercase leading-none tracking-tight text-center',
                      style: { fontSize: 'clamp(3rem, 12vw, 160px)' },
                    },
                    'About me'
                  )
                ),
                React.createElement('div', { className: 'h-10 sm:h-14 md:h-16 w-full' }),
                React.createElement(AnimatedText, {
                  text: "With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!",
                  className: 'text-[#D7E2EA] font-medium text-center leading-relaxed max-w-[560px]',
                }),
                React.createElement('div', { className: 'h-16 sm:h-20 md:h-24 w-full' }),
                React.createElement(
                  FadeIn,
                  { delay: 0.2, y: 20 },
                  React.createElement(ContactButton, null)
                )
              )
            );
          };

          // 9. ServicesSection
          const SERVICES = [
            {
              number: '01',
              name: '3D Modeling',
              description: 'Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations.',
            },
            {
              number: '02',
              name: 'Rendering',
              description: 'High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life.',
            },
            {
              number: '03',
              name: 'Motion Design',
              description: 'Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences.',
            },
            {
              number: '04',
              name: 'Branding',
              description: 'Crafting cohesive visual identities -- from logos to full brand systems -- that communicate a clear and memorable presence.',
            },
            {
              number: '05',
              name: 'Web Design',
              description: 'Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience.',
            },
          ];

          const ServicesSection = () => {
            return React.createElement(
              'section',
              {
                id: 'services',
                className: 'bg-[#FFFFFF] text-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 relative z-0 select-none',
              },
              React.createElement(
                'div',
                { className: 'max-w-5xl mx-auto' },
                React.createElement(
                  FadeIn,
                  { delay: 0, y: 30 },
                  React.createElement(
                    'h2',
                    {
                      className: 'text-[#0C0C0C] font-black uppercase text-center mb-16 sm:mb-20 md:mb-28 leading-none tracking-tight',
                      style: { fontSize: 'clamp(3rem, 12vw, 160px)' },
                    },
                    'Services'
                  )
                ),
                React.createElement(
                  'div',
                  { className: 'flex flex-col' },
                  SERVICES.map((item, index) =>
                    React.createElement(
                      FadeIn,
                      { key: item.number, delay: index * 0.1, y: 30 },
                      React.createElement(
                        'div',
                        { className: 'flex flex-col md:flex-row md:items-center justify-between py-8 sm:py-10 md:py-12 border-b border-[#0C0C0C]/15 gap-4 md:gap-10' },
                        React.createElement(
                          'div',
                          {
