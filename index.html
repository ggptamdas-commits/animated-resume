<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMDAUL HOQUE — RESTAURANT SUPERVISOR</title>
    <meta name="description" content="Resume of Amdaul Hoque — Restaurant Supervisor & Automation Specialist in Jizan, Saudi Arabia." />
    <meta name="author" content="Amdaul Hoque" />

    <!-- Google Fonts: Kanit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Custom Smooth Scroll & Scrollbar -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        background-color: #0C0C0C;
        color: #D7E2EA;
        font-family: 'Kanit', sans-serif;
        overflow-x: clip;
        min-height: 100vh;
        width: 100%;
      }
      .hero-heading {
        background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0C0C0C;
      }
      ::-webkit-scrollbar-thumb {
        background: #24292e;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3e444b;
      }
    </style>
  </head>
  <body class="bg-[#0C0C0C] text-[#D7E2EA] font-['Kanit'] selection:bg-[#1E354F] selection:text-white">
    <div id="root" class="bg-[#0C0C0C] min-h-screen w-full" style="overflow-x: clip;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
